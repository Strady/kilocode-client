[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kilocode-client"
version = "0.1.0"
description = "Async + sync Python client for the Kilo Code headless HTTP/SSE server (kilo serve)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kilo Code client" }]
keywords = ["kilo", "kilo-code", "opencode", "agent", "sse", "http-client"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25,<1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
]

[tool.setuptools.packages.find]
include = ["kilocode_client*"]

[tool.setuptools.package-data]
kilocode_client = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["kilocode_client"]
warn_unused_ignores = true